name: CI

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test on node@${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The oldest node engines.node claims, plus current LTS. An untested
        # floor is a guess — every Dockerfile here is node 24.
        node: ["22", "lts/*"]
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v5
      - name: Setup pnpm 🔧
        uses: pnpm/action-setup@v6
      - name: Setup node 🔧
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          check-latest: true
          cache: "pnpm"
      - name: Install 🪄
        run: pnpm install --frozen-lockfile
      - name: Lint 🔍
        run: pnpm run lint
      - name: Format 🔍
        run: pnpm run format:check
      - name: TypeScript 🔍
        run: pnpm run typecheck
      - name: Test 🧪
        run: pnpm run test
      - name: Build 📦
        run: pnpm run build
      # The tool list is the server's public contract, and it is easy to change
      # by accident. This asserts the built CLI still speaks MCP over stdio, and
      # that an unconfigured capability is absent rather than merely refused.
      # The tool list is the server's public contract and is easy to change by
      # accident. Three phases, because the negative check in phase 2 passes
      # vacuously if a tool is renamed — phase 3 is what stops that.
      #
      # HOME is pointed at nothing so the runner's own dotfiles can never be
      # picked up. For any server that reads one (~/.npmrc, ~/.aws/credentials),
      # omitting this tests a different server than an unconfigured user gets.
      - name: MCP smoke test 🧪
        run: |
          list_tools() {
            printf '%s\n' \
              '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}' \
              '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
              '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
            | env HOME=/nonexistent IOS_DEVICE_CONFIG=/nonexistent.json "$@" node dist/cli.js 2>/dev/null
          }

          # 1. With nothing configured — no device, no Xcode on the runner — the
          #    server must still speak MCP. One that exits here shows in the
          #    client as a bare "Connection closed" with stderr swallowed, so
          #    nothing ever explains what to set.
          list_tools > /tmp/unconfigured.json
          grep -q '"name":"ios_device_diagnostics"' /tmp/unconfigured.json \
            || { echo "ios_device_diagnostics missing from an unconfigured server"; exit 1; }
          grep -q '"name":"ios_device_screenshot"' /tmp/unconfigured.json \
            || { echo "the observe tools must be registered without any configuration"; exit 1; }

          # 2. Without the write flag the tools that drive the device must be
          #    ABSENT — not merely refused. A refusal still lets a model try,
          #    retry and reason about a way around it.
          cp /tmp/unconfigured.json /tmp/readonly.json
          ! grep -qE '"name":"ios_device_(tap|swipe|type|press_button|install|launch|terminate|pull_container|restart_wda)' /tmp/readonly.json \
            || { echo "driving tools leaked without IOS_DEVICE_ALLOW_WRITES"; exit 1; }

          # 3. Turning the flag ON must only ever ADD. A gate written the wrong
          #    way round (`if (allowWrites) return;`) makes read tools vanish
          #    instead, which phase 2 cannot see — it only looks for extras.
          list_tools IOS_DEVICE_ALLOW_WRITES=1 > /tmp/writes.json
          grep -q '"name":"ios_device_tap"' /tmp/writes.json \
            || { echo "the write gate added nothing — phase 2 has gone vacuous"; exit 1; }
          grep -o '"name":"ios_device_[a-z_]*"' /tmp/readonly.json | sort -u > /tmp/a.txt
          grep -o '"name":"ios_device_[a-z_]*"' /tmp/writes.json | sort -u > /tmp/b.txt
          missing=$(comm -23 /tmp/a.txt /tmp/b.txt)
          [ -z "$missing" ] \
            || { echo "these tools disappeared when writes were enabled: $missing"; exit 1; }
          echo "smoke test ok: $(wc -l < /tmp/a.txt) read tools, $(comm -13 /tmp/a.txt /tmp/b.txt | wc -l) added by the write gate"

  publish-npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    # id-token: write is required for OIDC trusted publishing + provenance
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v5
      - name: Setup pnpm 🔧
        uses: pnpm/action-setup@v6
      - name: Setup node 🔧
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: "pnpm"
          registry-url: https://registry.npmjs.org
      - name: Install 🪄
        run: pnpm install --frozen-lockfile
      - name: Upgrade npm 🔧
        # OIDC trusted publishing needs a recent npm CLI
        run: npm install -g npm@latest
      # A version already on npm cannot be republished, so re-running this job
      # would fail on a duplicate. Skip instead, so pushing a tag is always safe.
      - name: Check npm for this version 🔍
        id: published
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$name@$version is already published — skipping publish."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish 🚀
        if: steps.published.outputs.exists == 'false'
        run: npm publish --provenance --access public

  github-release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v5
      - name: Create release 🏷️
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
